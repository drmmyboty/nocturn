:root{--bg:#000;--fg:#e8ecf7;--mute:#7d86a3;--line:#1b2033;--chip:#0d1120;--acc:hsl(228,80%,68%);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#000;--fg:#e8ecf7}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Sora,system-ui,sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:20px 18px 40px}
h1{font-weight:300;font-size:2rem;letter-spacing:.32em;margin:6px 0 2px}
p.sub{margin:0 0 18px;color:var(--mute);font-size:.9rem}
.logo{display:block;width:72px;height:auto;margin:0 auto 4px}
.phone{width:min(64vw,250px);aspect-ratio:9/19.5;margin:0 auto 20px;border:1px solid var(--line);border-radius:34px;overflow:hidden;box-shadow:0 0 60px color-mix(in srgb,var(--acc) 22%,transparent)}
canvas{width:100%;height:100%;display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.s{display:flex;align-items:center;justify-content:center;flex:1 1 40%;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--chip);color:var(--fg);font:inherit;font-size:.85rem}
.s[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
label{display:block;font-size:.8rem;color:var(--mute);margin:12px 0 4px}
input[type=range]{width:100%;accent-color:var(--acc)}
button.go{width:100%;margin-top:18px;padding:15px;border:0;border-radius:16px;background:var(--acc);color:#000;font:inherit;font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#ov{position:fixed;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;z-index:5}
#ov img{max-height:78vh;max-width:100%;border-radius:20px}
#ov p{margin:0;color:var(--mute);font-size:.85rem}
</style>

<h1 style="text-align:center">NOCTURN</h1>
<p class="sub" style="text-align:center">Dark, animated wallpapers that cost your screen almost nothing.</p>
<div class="phone"><canvas id="c" width="540" height="1170"></canvas></div>
<div class="row" id="styles" role="group" aria-label="Wallpaper style"></div>
<label for="hue">Color</label>
<input id="hue" type="range" min="0" max="360" value="228">
<label for="spd">Speed</label>
<input id="spd" type="range" min="1" max="30" value="10">
<button class="go" id="save">Save as PNG</button>
</main>
<div id="ov"><img id="im" alt="Wallpaper preview"><p>Press and hold the image to save it.</p><button class="s" id="cl" style="flex:none">Close</button></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=cv.width,H=cv.height;
const names=['Stars','Aurora','Embers','Tides','My photo'];let img=null;let style=0,hue=228,spd=1,t=0;
const R=(a,b)=>a+Math.random()*(b-a);
const stars=Array.from({length:140},()=>({x:R(0,W),y:R(0,H),r:R(.6,2),p:R(0,6)}));
const emb=Array.from({length:60},()=>({x:R(0,W),y:R(0,H),r:R(1,3.5),v:R(.3,1.2)}));
function draw(){
 x.fillStyle='#000';x.fillRect(0,0,W,H);
 const c=(l,a=1)=>`hsla(${hue},80%,${l}%,${a})`;
 if(style==0){
  stars.forEach(s=>{x.fillStyle=c(85,.35+.65*Math.abs(Math.sin(t*.8+s.p)));x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();s.y+=.05*spd;if(s.y>H)s.y=0});
  const g=x.createRadialGradient(W*.7,H*.18,0,W*.7,H*.18,120);g.addColorStop(0,c(92));g.addColorStop(.3,c(70,.35));g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 }else if(style==1){
  for(let i=0;i<4;i++){x.beginPath();x.moveTo(0,H);for(let px=0;px<=W;px+=18){x.lineTo(px,H*.45+Math.sin(px*.012+t*.6+i)*70+i*45)}x.lineTo(W,H);x.closePath();
   const g=x.createLinearGradient(0,H*.3,0,H);g.addColorStop(0,`hsla(${hue+i*28},85%,60%,.28)`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fill()}
 }else if(style==2){
  emb.forEach(e=>{e.y-=e.v*spd;e.x+=Math.sin(t+e.y*.01)*.4;if(e.y<-5){e.y=H+5;e.x=R(0,W)}
   x.fillStyle=c(65,.2+e.r/6);x.shadowColor=c(60);x.shadowBlur=14;x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fill()});x.shadowBlur=0;
 }else if(style==4){
  if(img){const k=Math.max(W/img.width,H/img.height);x.drawImage(img,(W-img.width*k)/2,(H-img.height*k)/2,img.width*k,img.height*k)}
 }else{
  for(let i=0;i<26;i++){const y=H*.35+i*26;x.beginPath();for(let px=0;px<=W;px+=10){const yy=y+Math.sin(px*.02+t*.7+i*.4)*(6+i*.5);px?x.lineTo(px,yy):x.moveTo(px,yy)}
   x.strokeStyle=c(35+i*1.6,.1+i/40);x.lineWidth=1.5;x.stroke()}
 }
 t+=.016*spd;
}
function loop(){draw();requestAnimationFrame(loop)}
const fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.setAttribute('aria-label','Choose a photo');fi.style.cssText='position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0';
const box=document.getElementById('styles');
names.forEach((n,i)=>{const b=document.createElement(i==4?'label':'button');b.className='s';b.textContent=n;b.setAttribute('aria-pressed',i==0);
 if(i==4){b.style.position='relative';b.appendChild(fi)}else b.onclick=()=>sel(i);box.appendChild(b)});
function sel(i){style=i;[...box.children].forEach((k,j)=>k.setAttribute('aria-pressed',j==i))}
fi.onchange=()=>{const f=fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{img=im;sel(4)};im.src=r.result};r.readAsDataURL(f);fi.value=''};
document.getElementById('hue').oninput=e=>{hue=+e.target.value;document.documentElement.style.setProperty('--acc',`hsl(${hue},80%,68%)`)};
document.getElementById('spd').oninput=e=>{spd=e.target.value/10};
document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='nocturn-wallpaper.png';a.click()};
document.getElementById('cl').onclick=()=>{document.getElementById('ov').style.display='none'};
if(matchMedia('(prefers-reduced-motion: reduce)').matches){spd=.2}
loop();
</script>
